<div class="field{% if field.errors %} invalid{% endif %}">{% if field.field.widget.input_type == 'checkbox' %}<label class="check">{{ field }}<span>{{ field.label }}</span></label>{% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required">필수</span>{% else %}<span class="optional">선택</span>{% endif %}</label>{{ field }}{% endif %}{% if field.help_text %}<p class="hint">{{ field.help_text }}</p>{% endif %}{% for error in field.errors %}<p class="error-text" role="alert">{{ error }}</p>{% endfor %}</div>
